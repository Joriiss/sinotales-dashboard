name: Deploy to VPS

on:
  push:
    branches:
      - main  # or your deployment branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 59821
          script: |
            cd /srv/china_blog_dashboard
            # Keep deploy resilient when GitHub SSH :22 is blocked
            git remote set-url origin https://github.com/Joriiss/sinotales-dashboard.git || true
            sudo chown -R "$USER":"$USER" /srv/china_blog_dashboard || true
            git fetch origin main
            git reset --hard origin/main
            git clean -fd -e venv -e .env -e media -e staticfiles -e logs
            source venv/bin/activate
            pip install -r requirements.txt
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput
            sudo systemctl restart apache2
